---

version: '3'

tasks:
  install:
    desc: "Install tools"
    cmds:
      - go build -v -o bin/newline-after-block github.com/breml/newline-after-block/cmd/newline-after-block
      - go build -v -o bin/lefthook github.com/evilmartians/lefthook/v2
      - go build -v -o bin/task github.com/go-task/task/v3/cmd/task
      - go build -v -o bin/golangci-lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - go build -v -o bin/gofumpt mvdan.cc/gofumpt
      - go build -v -o bin/commit-msg-lint github.com/breml/githooks/cmd/commit-msg-lint

  install-githooks:
    desc: "Install git hooks using lefthook"
    cmds:
      - bin/lefthook install

  format:
    desc: "Format code"
    aliases: [ fmt ]
    cmds:
      - bin/gofumpt -l -w .
      - bin/newline-after-block -fix ./...

  lint:
    desc: "Run linters"
    cmds:
      - markdownlint-cli2 --fix --files '**/*.md' '!.scratch/**' '!.beads/**' '!docs/**'
      - bin/golangci-lint config verify
      - bin/golangci-lint run --fix ./...

  test:
    desc: "Run tests"
    cmds:
      - go test -v -shuffle=on -cover -timeout=120s -parallel=10 ./...

  testacc:
    desc: "Run acceptance tests"
    summary: |
      Run the acceptance test suite, or one shard of it.

      Acceptance tests are dominated by Terraform CLI process overhead, not by
      Uptime Kuma, so they scale well beyond the number of available cores.

        task testacc                    # the whole suite
        task testacc PARALLEL=4         # lower the -parallel value (default 8)
        task testacc SHARD=1 SHARDS=4   # shard 1 of 4, as the CI matrix runs it

      Shards are derived from the actual test list, so every test lands in
      exactly one shard and a newly added test can never fall through a gap.
    env:
      TF_ACC: "1"
    vars:
      PARALLEL: '{{.PARALLEL | default "8"}}'
      SHARD: '{{.SHARD | default "1"}}'
      SHARDS: '{{.SHARDS | default "1"}}'
    cmds:
      - |
        set -eu
        run='.*'
        if [ '{{.SHARDS}}' -gt 1 ]; then
          names=$(go test -list '.*' ./... | grep '^Test' | sort | \
            awk 'NR % {{.SHARDS}} == {{.SHARD}} % {{.SHARDS}}' | paste -sd '|')
          if [ -z "$names" ]; then
            echo "shard {{.SHARD}} of {{.SHARDS}} matches no tests" >&2
            exit 1
          fi
          run="^($names)\$"
        fi
        go test -v -shuffle on -coverprofile coverage.out -timeout 1800s \
          -parallel {{.PARALLEL}} -run "$run" ./...

  testacc-cover-report:
    desc: "Generate acceptance tests coverage report"
    preconditions:
      - test -f coverage.out
    cmds:
      - go tool cover -func=coverage.out | sort -k3 -rn

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -f coverage.out

  build:
    desc: "Build all code"
    cmds:
      - go build -v ./...

  generate-docs:
    desc: "Generate documentation"
    dir: ./tools
    cmds:
      - go generate ./...
